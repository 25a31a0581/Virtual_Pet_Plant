<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botani3D - Premium Virtual Plant Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at center, #1a2e22 0%, #0d1711 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .app-container {
            display: flex;
            background: rgba(20, 35, 26, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            width: 850px;
            max-width: 95vw;
            height: 520px;
            overflow: hidden;
        }
        /* 3D Canvas Viewport Section */
        .viewport-section {
            flex: 1.3;
            position: relative;
            background: linear-gradient(180deg, #122218 0%, #0a130e 100%);
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        .water-effect-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(56,189,248,0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .water-effect-overlay.active {
            opacity: 1;
        }

        /* Control & Dashboard Panel */
        .control-section {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(15, 26, 19, 0.85);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }
        .brand-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #4ade80;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .brand-header p {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Metrics & Stats */
        .metrics-grid {
            margin: 15px 0;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 10px;
        }
        .metric-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #cbd5e1;
        }
        .progress-track {
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 100%;
            border-radius: 4px;
            transition: width 0.5s ease, background-color 0.5s ease;
        }
        #waterBar { background: #38bdf8; }
        #sunBar { background: #fbbf24; }

        /* Action Buttons */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-action {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
            transition: transform 0.15s ease, filter 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .btn-action:active {
            transform: translateY(0);
        }

        /* Status Dialog Console */
        .status-console {
            background: rgba(10, 18, 13, 0.9);
            border: 1px solid rgba(74, 222, 128, 0.2);
            border-radius: 12px;
            padding: 12px;
            font-size: 12px;
            color: #86efac;
            line-height: 1.4;
            min-height: 48px;
            display: flex;
            align-items: center;
        }
    </style>

    <!-- Include Three.js 3D Library via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- 3D Viewport -->
        <div class="viewport-section">
            <div class="water-effect-overlay" id="waterOverlay"></div>
            <div id="webgl-container"></div>
        </div>

        <!-- Dashboard Controller -->
        <div class="control-section">
            <div class="brand-header">
                <h1>🌿 Botani3D Pro</h1>
                <p>Natural Specimen Simulator</p>
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-info">
                        <span>Hydration Index</span>
                        <span id="waterVal">100%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="waterBar"></div>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-info">
                        <span>Photosynthesis Level</span>
                        <span id="sunVal">100%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="sunBar"></div>
                    </div>
                </div>
            </div>

            <div class="actions-grid">
                <button class="btn-action" onclick="triggerWatering()">
                    💧 Spray Water
                </button>
                <button class="btn-action" onclick="triggerSunlight()" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);">
                    ☀️ Sunlight
                </button>
            </div>

            <div class="status-console" id="consoleMsg">
                System Initialized. 3D botanical specimen active and growing naturally.
            </div>
        </div>
    </div>

    <!-- 3D Game Engine Script -->
    <script>
        let scene, camera, renderer, plantGroup, potMesh;
        let waterLevel = 100;
        let sunLevel = 100;
        let growthStage = 1.0; // 0.5 (wilting) to 1.5 (flourishing)

        // Initialize 3D Three.js Scene
        function init3D() {
            const container = document.getElementById('webgl-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a130e, 0.08);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 7);
            camera.lookAt(0, 1.2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Studio Lighting Setup for Photorealistic Look
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.5);
            dirLight.position.set(5, 8, 4);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.8);
            rimLight.position.set(-5, 4, -4);
            scene.add(rimLight);

            buildPotAndSoil();
            build3DPlant();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        // Build Realistic 3D Terracotta Pot
        function buildPotAndSoil() {
            // Pot geometry
            const potGeo = new THREE.CylinderGeometry(1.1, 0.7, 1.8, 32);
            const potMat = new THREE.MeshStandardMaterial({ 
                color: 0xc86d51, 
                roughness: 0.8,
                metalness: 0.1
            });
            potMesh = new THREE.Mesh(potGeo, potMat);
            potMesh.position.y = 0.9;
            potMesh.castShadow = true;
            potMesh.receiveShadow = true;
            scene.add(potMesh);

            // Soil Bed
            const soilGeo = new THREE.CylinderGeometry(1.05, 1.05, 0.2, 32);
            const soilMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.9 });
            const soilMesh = new THREE.Mesh(soilGeo, soilMat);
            soilMesh.position.y = 1.7;
            scene.add(soilMesh);
        }

        // Build 3D Procedural Botanical Plant Model
        function build3DPlant() {
            plantGroup = new THREE.Group();
            plantGroup.position.y = 1.8;
            scene.add(plantGroup);

            // Main Central Stem
            const stemGeo = new THREE.CylinderGeometry(0.08, 0.12, 2.2, 12);
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.6 });
            const stem = new THREE.Mesh(stemGeo, stemMat);
            stem.position.y = 1.1;
            stem.castShadow = true;
            plantGroup.add(stem);

            // Procedural Leaves Placement
            const leafCount = 6;
            for (let i = 0; i < leafCount; i++) {
                const leafGroup = new THREE.Group();
                
                const leafShape = new THREE.ConeGeometry(0.35, 1.1, 7);
                leafShape.scale(1, 0.2, 1); // Flatten into natural leaf profile
                
                const leafMat = new THREE.MeshStandardMaterial({ 
                    color: 0x4ade80, 
                    roughness: 0.4,
                    side: THREE.DoubleSide
                });
                
                const leafMesh = new THREE.Mesh(leafShape, leafMat);
                leafMesh.position.x = 0.5;
                leafMesh.castShadow = true;
                leafGroup.add(leafMesh);

                // Position and angle along the stem
                const heightPercent = (i + 1) / (leafCount + 1);
                leafGroup.position.y = heightPercent * 2.0;
                leafGroup.rotation.y = i * ((Math.PI * 2) / 3) + (i % 2 * 0.5);
                leafGroup.rotation.z = 0.4; // Natural upward curve

                leafGroup.name = `leaf_${i}`;
                plantGroup.add(leafGroup);
            }
        }

        // Render Loop & Subtle Organic Animation
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Gentle natural breeze sway
            if (plantGroup) {
                plantGroup.rotation.z = Math.sin(elapsedTime * 1.5) * 0.03 * growthStage;
                plantGroup.rotation.x = Math.cos(elapsedTime * 1.2) * 0.02 * growthStage;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('webgl-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        // Interactive Simulation Logic
        function updateUI() {
            document.getElementById('waterVal').innerText = Math.round(waterLevel) + '%';
            document.getElementById('sunVal').innerText = Math.round(sunLevel) + '%';
            document.getElementById('waterBar').style.width = waterLevel + '%';
            document.getElementById('sunBar').style.width = sunLevel + '%';

            // Visually scale the 3D plant based on health/growth
            growthStage = 0.7 + (waterLevel + sunLevel) / 200 * 0.6;
            if (plantGroup) {
                plantGroup.scale.set(growthStage, growthStage, growthStage);
            }
        }

        function triggerWatering() {
            waterLevel = Math.min(100, waterLevel + 30);
            
            // Visual water overlay effect
            const overlay = document.getElementById('waterOverlay');
            overlay.classList.add('active');
            
            document.getElementById('consoleMsg').innerText = "💧 Water applied successfully! Botanical cells absorbing hydration; structural rigidity restored.";

            setTimeout(() => {
                overlay.classList.remove('active');
            }, 800);

            updateUI();
        }

        function triggerSunlight() {
            sunLevel = Math.min(100, sunLevel + 30);
            document.getElementById('consoleMsg').innerText = "☀️ Peak sunlight exposure activated! Chloroplast activity and growth rate maximized.";
            updateUI();
        }

        // Automatic background resource depletion
        setInterval(() => {
            if (waterLevel > 0) waterLevel -= 2;
            if (sunLevel > 0) sunLevel -= 2;

            if (waterLevel < 25 || sunLevel < 25) {
                document.getElementById('consoleMsg').innerText = "⚠️ Warning: Specimen stress detected due to low resources. Immediate care required.";
            }
            updateUI();
        }, 4000);

        window.onload = init3D;
    </script>
</body>
</html>
