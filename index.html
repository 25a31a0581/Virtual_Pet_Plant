<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sproutly - Virtual Pet Plant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .game-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.15);
            text-align: center;
            width: 380px;
            border: 2px solid rgba(129, 199, 132, 0.3);
        }
        h1 {
            color: #2e7d32;
            font-size: 24px;
            margin-bottom: 2px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 12px;
            color: #81c784;
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .plant-stage-box {
            background: #f1f8e9;
            border-radius: 20px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 20px;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
            padding-bottom: 20px;
        }

        /* GRAPHICAL PLANT ILLUSTRATION STYLES */
        .plant-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.5s ease;
        }

        /* Leaves and Sprouts based on growth stage */
        .plant-graphics {
            height: 70px;
            position: relative;
            width: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: -5px;
        }

        /* Stage 0: Seed */
        .seed {
            width: 16px;
            height: 12px;
            background: #8d6e63;
            border-radius: 50%;
            margin-bottom: 5px;
        }

        /* Stage 1: Sprout */
        .sprout-leaf-left, .sprout-leaf-right {
            position: absolute;
            width: 20px;
            height: 12px;
            background: #81c784;
            border-radius: 50% 50% 0 50%;
            bottom: 5px;
        }
        .sprout-leaf-left {
            left: 32px;
            transform: rotate(-30deg);
        }
        .sprout-leaf-right {
            right: 32px;
            transform: rotate(30deg) scaleX(-1);
        }
        .stem {
            width: 4px;
            height: 25px;
            background: #66bb6a;
            position: absolute;
            bottom: 0;
        }

        /* Stage 2 & 3: Bigger Plant / Flower details */
        .big-stem {
            width: 6px;
            height: 45px;
            background: #4caf50;
            position: absolute;
            bottom: 0;
        }
        .leaf-big-1, .leaf-big-2 {
            position: absolute;
            width: 30px;
            height: 16px;
            background: #66bb6a;
            border-radius: 50% 50% 0 50%;
        }
        .leaf-big-1 { left: 15px; bottom: 15px; transform: rotate(-25deg); }
        .leaf-big-2 { right: 15px; bottom: 25px; transform: rotate(25deg) scaleX(-1); }
        
        .flower-bloom {
            position: absolute;
            top: -15px;
            width: 35px;
            height: 35px;
            background: #ff80ab;
            border-radius: 50%;
            box-shadow: 0 0 0 8px rgba(255, 64, 129, 0.3);
            display: none;
        }

        /* Flower Pot Graphics */
        .pot-rim {
            width: 90px;
            height: 14px;
            background: #d7ccc8;
            border-radius: 6px;
            border: 2px solid #bcaaa4;
            z-index: 2;
        }
        .pot-body {
            width: 74px;
            height: 55px;
            background: linear-gradient(90deg, #d7ccc8 0%, #bcaaa4 100%);
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            position: relative;
            z-index: 1;
        }
        .soil {
            width: 70px;
            height: 10px;
            background: #5d4037;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            z-index: 3;
        }

        /* Stats & UI Layout */
        .stats-container {
            background: #fafafa;
            padding: 12px 15px;
            border-radius: 14px;
            margin-bottom: 15px;
            text-align: left;
            border: 1px solid #eeeeee;
        }
        .stat-row {
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 600;
            color: #424242;
        }
        .stat-row:last-child {
            margin-bottom: 0;
        }
        .progress-bar-bg {
            background: #e0e0e0;
            border-radius: 10px;
            height: 8px;
            width: 100%;
            margin-top: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 100%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        #waterFill { background-color: #42a5f5; }
        #sunFill { background-color: #ffa726; }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        button {
            flex: 1;
            background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(67, 160, 71, 0.3);
        }
        #message {
            font-size: 12px;
            color: #616161;
            font-style: italic;
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fbe7;
            border-radius: 10px;
            padding: 6px;
            border: 1px dashed #dce775;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>🌱 Sproutly</h1>
        <div class="subtitle">Your Virtual Pet Plant</div>
        
        <div class="plant-stage-box">
            <!-- Graphical Plant Visual Structure -->
            <div class="plant-graphics" id="plantVisual">
                <div class="seed" id="visualSeed"></div>
            </div>
            <!-- Pot Structure -->
            <div style="position: relative;">
                <div class="soil"></div>
            </div>
            <div class="pot-rim"></div>
            <div class="pot-body"></div>
        </div>

        <div class="stats-container">
            <div class="stat-row">
                Mood: <span id="moodText" style="color: #2e7d32;">Happy! 😊</span>
            </div>
            <div class="stat-row">
                Water Level (<span id="waterText">100</span>%)
                <div class="progress-bar-bg">
                    <div id="waterFill" class="progress-bar-fill"></div>
                </div>
            </div>
            <div class="stat-row" style="margin-top: 8px;">
                Sunlight Level (<span id="sunText">100</span>%)
                <div class="progress-bar-bg">
                    <div id="sunFill" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button onclick="waterPlant()">💧 Water</button>
            <button onclick="sunlightPlant()">☀️ Sunlight</button>
        </div>

        <div id="message">Your little seed is resting comfortably in the soil.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
