<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sproutly - Your Living Pet Plant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.15);
            text-align: center;
            width: 380px;
            border: 2px solid rgba(129, 199, 132, 0.3);
            position: relative;
        }
        h1 {
            color: #2e7d32;
            font-size: 24px;
            margin-bottom: 2px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 12px;
            color: #81c784;
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* STAGE BOX & ANIMATION AREA */
        .plant-stage-box {
            background: #f1f8e9;
            border-radius: 20px;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
            padding-bottom: 15px;
        }

        /* PLANT GRAPHICS & SWAYING */
        .plant-graphics {
            position: relative;
            width: 120px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            animation: gentleSway 4s ease-in-out infinite;
            transform-origin: bottom center;
            margin-bottom: -4px;
            z-index: 2;
        }
        @keyframes gentleSway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(3deg); }
        }

        .main-stem {
            width: 6px;
            height: 55px;
            background: #4caf50;
            position: absolute;
            bottom: 0;
            border-radius: 3px;
        }
        .leaf {
            position: absolute;
            width: 34px;
            height: 18px;
            background: #66bb6a;
            border-radius: 50% 50% 0 50%;
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.1);
        }
        .leaf-left-1 { left: 18px; bottom: 15px; transform: rotate(-30deg); }
        .leaf-right-1 { right: 18px; bottom: 25px; transform: rotate(30deg) scaleX(-1); }
        .leaf-left-2 { left: 14px; bottom: 35px; transform: rotate(-25deg); }
        .leaf-right-2 { right: 14px; bottom: 45px; transform: rotate(25deg) scaleX(-1); }
        .leaf-top { left: 43px; bottom: 52px; transform: rotate(-90deg); width: 38px; height: 20px; }

        /* POT WITH FACE */
        .pot-container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .soil {
            width: 76px;
            height: 12px;
            background: #5d4037;
            border-radius: 50%;
            position: absolute;
            top: -4px;
            z-index: 4;
        }
        .pot-rim {
            width: 96px;
            height: 14px;
            background: #d7ccc8;
            border-radius: 6px;
            border: 2px solid #bcaaa4;
            z-index: 5;
        }
        .pot-body {
            width: 80px;
            height: 60px;
            background: linear-gradient(135deg, #e64a19 0%, #d84315 100%);
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* FACE ELEMENTS */
        .face {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
        }
        .eyes-row {
            display: flex;
            gap: 18px;
            margin-bottom: 4px;
        }
        .eye {
            width: 10px;
            height: 12px;
            background: #212121;
            border-radius: 50%;
            animation: blink 4s infinite;
        }
        @keyframes blink {
            0%, 96%, 98% { transform: scaleY(1); }
            97%, 99% { transform: scaleY(0.1); }
        }
        .mouth {
            font-size: 14px;
            font-weight: bold;
            color: #212121;
        }

        /* INTERACTIVE OVERLAYS (Sun & Kettle) */
        .sun-overlay {
            position: absolute;
            top: -50px;
            right: 30px;
            font-size: 45px;
            transition: transform 0.8s ease, opacity 0.8s ease;
            opacity: 0;
            transform: translateY(-20px);
            z-index: 10;
        }
        .sun-overlay.active {
            opacity: 1;
            transform: translateY(60px);
            animation: spinSun 10s linear infinite;
        }
        @keyframes spinSun { 100% { transform: translateY(60px) rotate(360deg); } }

        .kettle-overlay {
            position: absolute;
            top: 20px;
            left: -60px;
            font-size: 38px;
            transition: transform 0.6s ease, opacity 0.6s ease;
            opacity: 0;
            z-index: 10;
        }
        .kettle-overlay.active {
            opacity: 1;
            transform: translateX(85px) rotate(-35deg);
        }
        .water-drops {
            position: absolute;
            top: 50px;
            left: 55px;
            font-size: 18px;
            opacity: 0;
            z-index: 9;
        }
        .water-drops.active {
            animation: dropRain 0.8s ease infinite;
        }
        @keyframes dropRain {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(40px); }
        }

        /* STATS & CONTROLS */
        .stats-container {
            background: #fafafa;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            text-align: left;
            border: 1px solid #eeeeee;
        }
        .stat-row {
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #424242;
        }
        .stat-row:last-child { margin-bottom: 0; }
        .progress-bar-bg {
            background: #e0e0e0;
            border-radius: 10px;
            height: 7px;
            width: 100%;
            margin-top: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 100%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        #waterFill { background-color: #42a5f5; }
        #sunFill { background-color: #ffa726; }
        
        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        button {
            flex: 1;
            background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
            color: white;
            border: none;
            padding: 9px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(67, 160, 71, 0.3);
            transition: transform 0.1s ease;
        }
        button:hover { transform: translateY(-1px); }
        
        #message {
            font-size: 11px;
            color: #33691e;
            font-weight: 500;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fbe7;
            border-radius: 8px;
            padding: 6px;
            border: 1px dashed #dce775;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>🌱 Sproutly</h1>
        <div class="subtitle">Your Living Pet Plant</div>
        
        <div class="plant-stage-box">
            <!-- Animated Overlays -->
            <div class="sun-overlay" id="sunIcon">☀️</div>
            <div class="kettle-overlay" id="kettleIcon">🫖</div>
            <div class="water-drops" id="rainIcon">💧💧</div>

            <!-- Plant Structure -->
            <div class="plant-graphics">
                <div class="main-stem"></div>
                <div class="leaf leaf-left-1"></div>
                <div class="leaf leaf-right-1"></div>
                <div class="leaf leaf-left-2"></div>
                <div class="leaf leaf-right-2"></div>
                <div class="leaf leaf-top"></div>
            </div>

            <!-- Pot & Face Structure -->
            <div class="pot-container">
                <div class="soil"></div>
                <div class="pot-rim"></div>
                <div class="pot-body">
                    <div class="face">
                        <div class="eyes-row">
                            <div class="eye" id="leftEye"></div>
                            <div class="eye" id="rightEye"></div>
                        </div>
                        <div class="mouth" id="mouthExpression">◡</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-row">
                Mood: <span id="moodText" style="color: #2e7d32;">Happy! 😊</span>
            </div>
            <div class="stat-row">
                Water Level (<span id="waterText">100</span>%)
                <div class="progress-bar-bg">
                    <div id="waterFill" class="progress-bar-fill"></div>
                </div>
            </div>
            <div class="stat-row" style="margin-top: 6px;">
                Sunlight Level (<span id="sunText">100</span>%)
                <div class="progress-bar-bg">
                    <div id="sunFill" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button onclick="waterPlant()">💧 Water</button>
            <button onclick="sunlightPlant()">☀️ Sunlight</button>
        </div>

        <div id="message">Hi there! I'm Sproutly, nice to meet you! Let's grow together! 🌱</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
