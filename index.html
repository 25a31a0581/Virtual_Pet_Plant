<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sproutly - Virtual Pet Plant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .game-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.15);
            text-align: center;
            width: 380px;
            border: 2px solid rgba(129, 199, 132, 0.3);
        }
        h1 {
            color: #2e7d32;
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 13px;
            color: #81c784;
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .plant-stage-box {
            background: #f1f8e9;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
        }
        .plant-display {
            font-size: 90px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .stats-container {
            background: #fafafa;
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid #eeeeee;
        }
        .stat-row {
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 600;
            color: #424242;
        }
        .stat-row:last-child {
            margin-bottom: 0;
        }
        .progress-bar-bg {
            background: #e0e0e0;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin-top: 5px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 100%;
            border-radius: 10px;
            transition: width 0.4s ease, background-color 0.4s ease;
        }
        #waterFill { background-color: #42a5f5; }
        #sunFill { background-color: #ffa726; }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
            color: white;
            border: none;
            padding: 12px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(67, 160, 71, 0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(67, 160, 71, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        #message {
            font-size: 13px;
            color: #616161;
            font-style: italic;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9fbe7;
            border-radius: 10px;
            padding: 8px;
            border: 1px dashed #dce775;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>🌱 Sproutly</h1>
        <div class="subtitle">Your Virtual Pet Plant</div>
        
        <div class="plant-stage-box">
            <div class="plant-display" id="plantEmoji">🌰</div>
        </div>

        <div class="stats-container">
            <div class="stat-row">
                Mood: <span id="moodText" style="color: #2e7d32;">Happy! 😊</span>
            </div>
            <div class="stat-row">
                Water Level (<span id="waterText">100</span>%)
                <div class="progress-bar-bg">
                    <div id="waterFill" class="progress-bar-fill"></div>
                </div>
            </div>
            <div class="stat-row" style="margin-top: 10px;">
                Sunlight Level (<span id="sunText">100</span>%)
                <div class="progress-bar-bg">
                    <div id="sunFill" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button onclick="waterPlant()">💧 Water</button>
            <button onclick="sunlightPlant()">☀️ Sunlight</button>
        </div>

        <div id="message">Your little seed is resting comfortably in the soil.</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
